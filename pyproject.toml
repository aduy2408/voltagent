[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "voltagent"
version = "0.1.0"
description = "Modular agentic AI assistant for electrical engineering"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.8",
  "pydantic-settings>=2.6",
  "openai>=1.50",
  "google-genai>=1.0",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]

[project.optional-dependencies]
rag = ["pypdf>=5.0", "numpy>=1.26", "sentence-transformers>=3.0", "chromadb>=0.5"]
dense = ["faiss-cpu>=1.8", "huggingface-hub>=0.30", "numpy>=1.26", "sentence-transformers>=3.0"]
vision = ["torch>=2.3", "ultralytics>=8.3", "opencv-python>=4.10", "pillow>=10", "numpy>=1.26", "huggingface-hub>=0.30", "onnx>=1.16", "onnxruntime>=1.18"]
test = ["pytest>=8.0", "httpx>=0.27", "pillow>=10", "ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

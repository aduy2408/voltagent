<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoltAgent</title>
  <link rel="stylesheet" href="/static/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.css">
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">V</span><span>VoltAgent</span></div>
      <button id="new-session" class="new-chat" type="button"><span>＋</span> New chat</button>
      <div class="sidebar-tools">
        <label class="search-box"><span>⌕</span><input id="session-search" placeholder="Search conversations" autocomplete="off"></label>
      </div>
      <div class="history-header"><span>Recent</span><span id="session-count" class="session-count">0</span></div>
      <div id="session-list" class="session-list"></div>
      <div class="sidebar-footer"><span class="status-dot"></span><span>Local workspace</span></div>
      <input id="session" type="hidden">
    </aside>

    <section class="workspace">
      <section class="chat-panel">
        <div id="messages" class="messages">
          <div class="welcome">
            <div class="welcome-mark">V</div>
            <h2>What are you working on?</h2>
            <p>Ask about circuits, components, calculations, or upload a schematic for inspection.</p>
          </div>
        </div>
        <div id="image-preview" class="image-preview" hidden></div>
        <form id="composer" class="composer">
          <input id="prompt" autocomplete="off" placeholder="Message VoltAgent...">
          <label class="upload-button" title="Attach an image"><span>＋</span><input id="image" type="file" accept="image/png,image/jpeg,image/webp"></label>
          <button class="send-button" type="submit" aria-label="Send message">↑</button>
        </form>
        <p class="composer-note">VoltAgent can make mistakes. Check important electrical work.</p>
      </section>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.22/dist/contrib/auto-render.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="/static/app.js" defer></script>
</body>
</html>

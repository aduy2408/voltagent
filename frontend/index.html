<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoltAgent Console</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="shell"><header><div><p class="eyebrow">VOLTAGENT / CONTROL PLANE</p><h1>Agent workspace</h1><p class="muted">Prototype console for routing, tools, and decisions.</p></div><span class="status"><i></i> local mode</span></header><section class="grid"><aside class="panel"><h2>Tools</h2><div id="tools" class="stack"></div><h2 class="section-gap">Session</h2><label>Session ID<input id="session" value="demo-session"></label></aside><section class="panel chat"><div id="messages" class="messages"><div class="message assistant"><span>VoltAgent</span><p>Ready. Ask me to inspect a tool or route a task.</p></div></div><form id="composer"><input id="prompt" autocomplete="off" placeholder="Describe a task..."><button>Send</button></form></section></section></main><script src="app.js" defer></script></body></html>
